<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NSAH - Nützliche Sparsame Alltags Hilfe</title>

<!-- LEAFLET -->
<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

/* =========================================================
   GRUNDLEGEND
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background-color: black;

    color: white;

    font-family: Arial, sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   HINTERGRUNDBILD
========================================================= */

.hintergrund-bild {

    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 40vw;
    height: 40vh;

    background-image:
        url("Nsah%20bilder/Screenshot2026-08-22214731(1).png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    border-radius: 25px;

    z-index: -1;

    opacity: 1;
}


/* =========================================================
   LOGO
========================================================= */

.logo {

    position: absolute;

    top: 30px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 80px;

    font-weight: bold;

    color: white;

    text-shadow:
        0 0 4px rgba(255,255,255,0.7),
        0 0 10px rgba(255,255,255,0.35),
        0 0 18px rgba(255,255,255,0.15);

    z-index: 10;

    white-space: nowrap;
}


/* =========================================================
   UNTERTITEL
========================================================= */

.untertitel {

    position: absolute;

    top: 110px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 26px;

    color: white;

    white-space: nowrap;

    z-index: 10;
}


/* =========================================================
   LINIE
========================================================= */

.strich {

    position: fixed;

    left: 10%;

    top: 0;
    bottom: 0;

    width: 2px;

    background-color: #333333;

    z-index: 5;
}


/* =========================================================
   ALLGEMEINE BUTTONS
========================================================= */

button {

    font-family: Arial, sans-serif;
}


/* =========================================================
   ANMELDEN BUTTON
========================================================= */

.anmelden-button {

    position: fixed;

    top: 25px;
    left: 25px;

    padding: 12px 20px;

    background-color: #222222;

    color: white;

    border: 1px solid #444444;

    border-radius: 7px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    z-index: 50;

    transition: 0.2s;
}

.anmelden-button:hover {

    background-color: #333333;
}


/* =========================================================
   KARTEN BUTTON
========================================================= */

.karten-button {

    position: fixed;

    top: 80px;
    left: 25px;

    padding: 12px 20px;

    background-color: #222222;

    color: white;

    border: 1px solid #444444;

    border-radius: 7px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    z-index: 50;

    transition: 0.2s;
}

.karten-button:hover {

    background-color: #333333;
}


/* =========================================================
   SPIELE BUTTON
   DIREKT UNTER DER KARTE
========================================================= */

.spiele-button {

    position: fixed;

    top: 135px;
    left: 25px;

    padding: 12px 20px;

    background-color: #222222;

    color: white;

    border: 1px solid #444444;

    border-radius: 7px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    z-index: 50;

    transition: 0.2s;
}

.spiele-button:hover {

    background-color: #333333;
}


/* =========================================================
   BENUTZER BUTTON
========================================================= */

.benutzer-button {

    display: none;

    position: fixed;

    top: 25px;
    left: 25px;

    padding: 12px 20px;

    background-color: #222222;

    color: white;

    border: 1px solid #444444;

    border-radius: 7px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    z-index: 50;
}

.benutzer-button:hover {

    background-color: #333333;
}


/* =========================================================
   BENUTZER MENÜ
========================================================= */

.benutzer-menue {

    display: none;

    position: fixed;

    top: 75px;
    left: 25px;

    width: 230px;

    background-color: #111111;

    border: 1px solid #333333;

    border-radius: 8px;

    padding: 15px;

    z-index: 200;
}

.benutzer-name {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 5px;
}

.benutzer-email {

    color: #888888;

    font-size: 13px;

    margin-bottom: 15px;

    word-break: break-all;
}

.abmelden-button {

    width: 100%;

    height: 40px;

    background-color: #222222;

    color: white;

    border: 1px solid #444444;

    border-radius: 6px;

    cursor: pointer;
}


/* =========================================================
   HINTERGRUND FÜR FENSTER
========================================================= */

.fenster-hintergrund,
.karten-hintergrund,
.spiele-hintergrund {

    display: none;

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background-color: rgba(0,0,0,0.85);

    z-index: 9999;
}


/* =========================================================
   LOGIN FENSTER
========================================================= */

.anmelde-fenster {

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%,-50%);

    width: 400px;

    max-width: calc(100% - 30px);

    background-color: #111111;

    border: 2px solid #333333;

    border-radius: 12px;

    padding: 30px;

    box-shadow:
        0 0 30px rgba(255,255,255,0.1);
}


/* =========================================================
   FENSTER KOPF
========================================================= */

.fenster-kopf {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;
}

.fenster-titel {

    font-size: 25px;

    font-weight: bold;
}

.schliessen {

    background: none;

    border: none;

    color: white;

    font-size: 28px;

    cursor: pointer;
}


/* =========================================================
   TABS
========================================================= */

.tabs {

    display: flex;

    margin-bottom: 20px;
}

.tab {

    flex: 1;

    padding: 12px;

    background-color: #222222;

    color: #aaaaaa;

    border: none;

    cursor: pointer;
}

.tab.aktiv {

    background-color: #333333;

    color: white;
}


/* =========================================================
   FORMULAR
========================================================= */

.formular {

    display: none;
}

.formular.aktiv {

    display: block;
}

.formular label {

    display: block;

    margin-bottom: 7px;

    color: #cccccc;
}

.formular input {

    width: 100%;

    height: 45px;

    margin-bottom: 18px;

    padding: 0 12px;

    background-color: #222222;

    color: white;

    border: 1px solid #444444;

    border-radius: 6px;

    outline: none;

    font-size: 15px;
}


/* =========================================================
   FORM BUTTON
========================================================= */

.formular-button {

    width: 100%;

    height: 45px;

    background-color: #333333;

    color: white;

    border: 1px solid #555555;

    border-radius: 6px;

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;
}

.formular-button:hover {

    background-color: #444444;
}


/* =========================================================
   HINWEIS
========================================================= */

.hinweis {

    margin-top: 15px;

    text-align: center;

    color: #777777;

    font-size: 13px;
}


/* =========================================================
   KARTEN FENSTER
========================================================= */

.karten-fenster {

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%,-50%);

    width: 80%;

    height: 80%;

    background-color: #111111;

    border: 2px solid #333333;

    border-radius: 12px;

    overflow: hidden;
}

.karten-kopf {

    height: 55px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 15px;

    background-color: #151515;

    border-bottom: 1px solid #333333;
}

.karten-titel {

    font-size: 20px;

    font-weight: bold;
}

.karten-schliessen {

    background: none;

    border: none;

    color: white;

    font-size: 28px;

    cursor: pointer;
}

#karte {

    width: 100%;

    height: calc(100% - 55px);
}


/* =========================================================
   SPIELE FENSTER
========================================================= */

.spiele-fenster {

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%,-50%);

    width: 650px;

    max-width: calc(100% - 30px);

    max-height: 85vh;

    overflow-y: auto;

    background-color: #111111;

    border: 2px solid #333333;

    border-radius: 15px;

    padding: 25px;

    box-shadow:
        0 0 35px rgba(255,255,255,0.1);
}


/* =========================================================
   SPIELE KOPF
========================================================= */

.spiele-kopf {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;
}

.spiele-titel {

    font-size: 28px;

    font-weight: bold;
}

.spiele-schliessen {

    background: none;

    border: none;

    color: white;

    font-size: 30px;

    cursor: pointer;
}


/* =========================================================
   SPIELE GRID
========================================================= */

.spiele-grid {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 15px;
}


/* =========================================================
   EINZELNES SPIEL
========================================================= */

.spiel {

    min-height: 130px;

    background-color: #1b1b1b;

    border: 1px solid #333333;

    border-radius: 12px;

    color: white;

    cursor: pointer;

    padding: 15px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    transition: 0.2s;
}

.spiel:hover {

    background-color: #292929;

    transform: translateY(-3px);

    border-color: #555555;
}

.spiel-icon {

    font-size: 40px;

    margin-bottom: 10px;
}

.spiel-name {

    font-size: 17px;

    font-weight: bold;
}


/* =========================================================
   SPIEL BEREICH
========================================================= */

#spielBereich {

    display: none;

    margin-top: 20px;

    background-color: #080808;

    border: 1px solid #333333;

    border-radius: 10px;

    padding: 15px;
}

#spielTitel {

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 15px;
}

.spiel-zurueck {

    width: 100%;

    height: 42px;

    margin-top: 15px;

    background-color: #222222;

    color: white;

    border: 1px solid #444444;

    border-radius: 7px;

    cursor: pointer;
}


/* =========================================================
   FLAPPY BIRD
========================================================= */

#flappyCanvas {

    display: block;

    width: 100%;

    max-width: 400px;

    height: auto;

    margin: auto;

    background-color: #222222;

    border: 1px solid #444444;

    border-radius: 8px;
}


/* =========================================================
   SNAKE
========================================================= */

#snakeCanvas {

    display: block;

    width: 100%;

    max-width: 400px;

    height: auto;

    margin: auto;

    background-color: #050505;

    border: 1px solid #444444;

    border-radius: 8px;
}

.snake-steuerung {

    display: flex;

    justify-content: center;

    gap: 8px;

    margin-top: 12px;
}

.snake-steuerung button {

    width: 45px;

    height: 40px;

    background-color: #222222;

    color: white;

    border: 1px solid #444444;

    border-radius: 6px;

    cursor: pointer;

    font-size: 18px;
}


/* =========================================================
   MEMORY
========================================================= */

.memory-grid {

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 8px;

    max-width: 400px;

    margin: auto;
}

.memory-card {

    aspect-ratio: 1 / 1;

    background-color: #222222;

    border: 1px solid #444444;

    border-radius: 8px;

    cursor: pointer;

    font-size: 28px;

    display: flex;

    justify-content: center;

    align-items: center;

    color: transparent;
}

.memory-card.offen {

    color: white;

    background-color: #333333;
}

.memory-card.gefunden {

    color: white;

    background-color: #444444;

    cursor: default;
}


/* =========================================================
   HANDY
========================================================= */

@media (max-width: 600px) {

    body {

        min-width: 0;

        overflow-x: hidden;
    }


    /* HINTERGRUNDBILD */

    .hintergrund-bild {
        left: 75%;
        top: 50%;

        transform: translate(-50%, -50%);

        width: 40vw;
        height: 40vh;

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        border-radius: 25px;
    }

}
    /* LOGO */

    .logo {

        top: 25px;

        left: 63%;

        font-size: 50px;

        white-space: nowrap;
    }


    /* UNTERTITEL */

    .untertitel {

        top: 88px;

        left: 63%;

        width: 72%;

        font-size: 17px;

        line-height: 1.4;

        text-align: center;

        white-space: normal;
    }


    /* LINIE */

    .strich {

        left: 24%;
    }


    /* ANMELDEN */

    .anmelden-button {

        top: 18px;

        left: 5px;

        padding: 8px 11px;

        font-size: 13px;
    }


    /* KARTE */

    .karten-button {

        top: 58px;

        left: 5px;

        padding: 8px 11px;

        font-size: 13px;
    }


    /* SPIELE */

    .spiele-button {

        top: 98px;

        left: 5px;

        padding: 8px 11px;

        font-size: 13px;
    }


    /* BENUTZER */

    .benutzer-button {

        top: 18px;

        left: 5px;

        padding: 9px 12px;

        font-size: 13px;

        max-width: 150px;

        overflow: hidden;

        text-overflow: ellipsis;

        white-space: nowrap;
    }


    /* BENUTZER MENÜ */

    .benutzer-menue {

        top: 62px;

        left: 5px;

        width: calc(100% - 10px);

        max-width: 260px;
    }


    /* LOGIN */

    .anmelde-fenster {

        width: calc(100vw - 30px);

        max-height: calc(100vh - 30px);

        overflow-y: auto;

        padding: 20px;
    }


    /* KARTE */

    .karten-fenster {

        width: 95%;

        height: 85%;

        border-radius: 10px;
    }


    /* SPIELE FENSTER */

    .spiele-fenster {

        width: calc(100% - 20px);

        max-width: none;

        max-height: 90vh;

        padding: 18px;

        border-radius: 12px;
    }


    /* SPIELE GRID */

    .spiele-grid {

        grid-template-columns: repeat(2, 1fr);

        gap: 10px;
    }


    .spiel {

        min-height: 110px;

        padding: 10px;
    }


    .spiel-icon {

        font-size: 32px;
    }


    .spiel-name {

        font-size: 14px;
    }


    /* MEMORY */

    .memory-grid {

        gap: 6px;
    }


    /* SNAKE STEUERUNG */

    .snake-steuerung button {

        width: 42px;

        height: 38px;
    }

}

</style>

</head>


<body>

</div>

>

<div class="karten-kopf">

<div class="karten-titel">

function kartenOeffnen() {

    document.getElementById(

    if (!karte) {

        karte = L.map(
            "karte",
            {

                worldCopyJump: false,

                maxBounds: [
                    [-90,-180],
                    [90,180]
                ],

                maxBoundsViscosity: 1.0

            }
        ).setView(
            [20,0],
            2
        );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {

                maxZoom: 19,

                noWrap: true,

                attribution:
                    "&copy; OpenStreetMap-Mitwirkende"

            }
        ).addTo(karte);


        if (
            navigator.geolocation
        ) {

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const lat =
                        position.coords.latitude;

                    const lon =
                        position.coords.longitude;


                    karte.setView(
                        [lat,lon],
                        13
                    );


                    if (standortMarker) {

                        karte.removeLayer(
                            standortMarker

                    standortMarker =
                        L.marker(
                            [lat,lon]

                    standortMarker

                },

                function() {

    setTimeout(
        function() {

/* =========================================================
   FLAPPY BIRD
========================================================= */

let flappyAnimation = null;

let flappyBird = null;

let flappyRohr = null;

let flappyPunkte = 0;

let flappyGameOver = false;


function flappyStarten() {

    const canvas =
        document.getElementById(
            "flappyCanvas"
        );

    const ctx =
        canvas.getContext("2d");


    flappyBird = {

        x: 80,

        y: 220,

        radius: 15,

        velocity: 0

    };


    flappyRohr = {

        x: 400,

        gapY: 250,

        gap: 150

    };


    flappyPunkte = 0;

    flappyGameOver = false;


    function zeichnen() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* Hintergrund */

        ctx.fillStyle = "#111";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* Rohre */

        ctx.fillStyle = "#555";


        ctx.fillRect(
            flappyRohr.x,
            0,
            50,
            flappyRohr.gapY - flappyRohr.gap / 2
        );


        ctx.fillRect(
            flappyRohr.x,
            flappyRohr.gapY + flappyRohr.gap / 2,
            50,
            canvas.height
        );


        /* Vogel */

        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            flappyBird.x,
            flappyBird.y,
            flappyBird.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* Punkte */

        ctx.fillStyle = "white";

        ctx.font = "24px Arial";

        ctx.fillText(
            "Punkte: " + flappyPunkte,
            15,
            30
        );


        if (flappyGameOver) {

            ctx.font = "28px Arial";

            ctx.textAlign = "center";

            ctx.fillText(
                "Game Over",
                canvas.width / 2,
                canvas.height / 2
            );

            ctx.font = "16px Arial";

            ctx.fillText(
                "Tippe / klicke zum Neustart",
                canvas.width / 2,
                canvas.height / 2 + 30
            );

            ctx.textAlign = "left";

            return;

        }


        flappyBird.velocity += 0.35;

        flappyBird.y +=
            flappyBird.velocity;


        flappyRohr.x -= 2;


        if (
            flappyRohr.x < -50
        ) {

            flappyRohr.x =
                canvas.width;

            flappyRohr.gapY =
                150 +
                Math.random() * 200;

            flappyPunkte++;

        }


        if (
            flappyBird.y < 0 ||
            flappyBird.y > canvas.height
        ) {

            flappyGameOver = true;

        }


        if (
            flappyBird.x + flappyBird.radius >
                flappyRohr.x &&
            flappyBird.x - flappyBird.radius <
                flappyRohr.x + 50 &&
            (
                flappyBird.y -
                flappyBird.radius <
                flappyRohr.gapY -
                flappyRohr.gap / 2 ||

                flappyBird.y +
                flappyBird.radius >
                flappyRohr.gapY +
                flappyRohr.gap / 2
            )
        ) {

            flappyGameOver = true;

        }


        flappyAnimation =
            requestAnimationFrame(
                zeichnen
            );

    }


    function springen() {

        if (flappyGameOver) {

            flappyStarten();

            return;

        }

        flappyBird.velocity = -6;

    }


    canvas.onclick = springen;

    canvas.ontouchstart =
        function(event) {

            event.preventDefault();

            springen();

        };


    zeichnen();

}


/* =========================================================
   SNAKE
========================================================= */

let snake = [];

let snakeFutter = {};

let snakeRichtungAktuell = "rechts";

let snakeTimer = null;


function snakeStarten() {

    const canvas =
        document.getElementById(
            "snakeCanvas"
        );

    const ctx =
        canvas.getContext("2d");


    snake = [

        {
            x: 10,
            y: 10
        },

        {
            x: 9,
            y: 10
        },

        {
            x: 8,
            y: 10
        }

    ];


    snakeRichtungAktuell =
        "rechts";


    snakeFutter = {

        x:
            Math.floor(
                Math.random() * 20
            ),

        y:
            Math.floor(
                Math.random() * 20
            )

    };


    if (snakeTimer) {

        clearInterval(
            snakeTimer
        );

    }


    snakeTimer =
        setInterval(
            snakeSpiel,
            130
        );


    function snakeSpiel() {

        const kopf = {
            x: snake[0].x,
            y: snake[0].y
        };


        if (
            snakeRichtungAktuell === "rechts"
        ) {

            kopf.x++;

        }


        if (
            snakeRichtungAktuell === "links"
        ) {

            kopf.x--;

        }


        if (
            snakeRichtungAktuell === "oben"
        ) {

            kopf.y--;

        }


        if (
            snakeRichtungAktuell === "unten"
        ) {

            kopf.y++;

        }


        if (
            kopf.x < 0 ||
            kopf.x >= 20 ||
            kopf.y < 0 ||
            kopf.y >= 20
        ) {

            snakeStarten();

            return;

        }


        for (
            let teil of snake
        ) {

            if (
                teil.x === kopf.x &&
                teil.y === kopf.y
            ) {

                snakeStarten();

                return;

            }

        }


        snake.unshift(
            kopf
        );


        if (
            kopf.x === snakeFutter.x &&
            kopf.y === snakeFutter.y
        ) {

            snakeFutter = {

                x:
                    Math.floor(
                        Math.random() * 20
                    ),

                y:
                    Math.floor(
                        Math.random() * 20
                    )

            };

        } else {

            snake.pop();

        }


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const groesse =
            canvas.width / 20;


        ctx.fillStyle = "white";


        for (
            let teil of snake
        ) {

            ctx.fillRect(
                teil.x * groesse,
                teil.y * groesse,
                groesse - 1,
                groesse - 1
            );

        }


        ctx.fillStyle = "#777";


        ctx.fillRect(
            snakeFutter.x * groesse,
            snakeFutter.y * groesse,
            groesse - 1,
            groesse - 1
        );

    }

}


function snakeRichtung(
    richtung
) {

    if (
        richtung === "links" &&
        snakeRichtungAktuell !== "rechts"
    ) {

        snakeRichtungAktuell =
            "links";

    }


    if (
        richtung === "rechts" &&
        snakeRichtungAktuell !== "links"
    ) {

        snakeRichtungAktuell =
            "rechts";

    }


    if (
        richtung === "oben" &&
        snakeRichtungAktuell !== "unten"
    ) {

        snakeRichtungAktuell =
            "oben";

    }


    if (
        richtung === "unten" &&
        snakeRichtungAktuell !== "oben"
    ) {

        snakeRichtungAktuell =
            "unten";

    }

}


/* =========================================================
   TASTATUR FÜR SNAKE
========================================================= */

document.addEventListener(

    function(event) {

        if (event.key === "ArrowUp") {

            snakeRichtung("oben");

        }

        if (event.key === "ArrowDown") {

            snakeRichtung("unten");

        }

        if (event.key === "ArrowLeft") {

            snakeRichtung("links");

        }

        if (event.key === "ArrowRight") {

let memoryErsteKarte = null;

let memorySperre = false;


function memoryStarten() {

    const grid =
        document.getElementById(
            "memoryGrid"
        );


    grid.innerHTML = "";


    memoryErsteKarte = null;

    memorySperre = false;


    const symbole = [

        "🍎",
        "🍎",

        "🚗",
        "🚗",

        "🐶",
        "🐶",

        "⭐",
        "⭐",

        "⚽",

        "🚀",
        "🚀",

        "🎮",
        "🎮"

    ];

    );

                document.createElement(
                    "button"
                );


            karte.className =
                "memory-card";

                symbol;


            karte.dataset.symbol =
                symbol;

                    memoryKarteOeffnen(
                        karte
                    );

                };


            grid.appendChild(
                karte
            );

        }
    );

}


function memoryKarteOeffnen(
    karte
) {

    if (
        memorySperre ||
        karte.classList.contains("offen") ||
        karte.classList.contains("gefunden")
    ) {

        return;

    }


    karte.classList.add(
        "offen"
    );


    if (
        !memoryErsteKarte
    ) {

        memoryErsteKarte =
            karte;

        return;

    }


    if (
        memoryErsteKarte.dataset.symbol ===
        karte.dataset.symbol
    ) {

        memoryErsteKarte.classList.add(
            "gefunden"
        );

        karte.classList.add(
            "gefunden"
        );

        memoryErsteKarte = null;

    } else {

        memorySperre = true;


        setTimeout(
            function() {

                memoryErsteKarte.classList.remove(
                    "offen"
                );

                karte.classList.remove(
                    "offen"
                );

                memoryErsteKarte = null;

                memorySperre = false;

            },
            800
        );

    }

}

/* =========================================================
   REGISTRIEREN
========================================================= */

async function registrieren() {

    const username =
        document.getElementById(
            "registerUsername"
        ).value.trim();


    const email =
        document.getElementById(
            "registerEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "registerPassword"
        ).value;


    const password2 =
        document.getElementById(
            "registerPassword2"
        ).value;


    if (
        !username ||
        !email ||
        !password ||
        !password2
    ) {

        alert(
            "Bitte fülle alle Felder aus."
        );

        return;

    }


    if (
        password !== password2
    ) {

        alert(
            "Die Passwörter stimmen nicht überein."
        );

        return;

    }


    if (
        password.length < 6
    ) {

        alert(
            "Das Passwort muss mindestens 6 Zeichen haben."
        );

        return;

    }


    try {

        const antwort =
            await fetch(
                "/api/register",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            {
                                username:
                                    username,

                                email:
                                    email,

                                password:
                                    password
                            }
                        )

                }
            );


        const daten =
            await antwort.json();


        if (
            daten.success
        ) {

            alert(
                "Konto erfolgreich erstellt!"
            );


            benutzerAnzeigen(
                daten.username,
                daten.email
            );


            anmeldenSchliessen();


        } else {

            alert(
                daten.message
            );

        }

    } catch (fehler) {

        console.error(
            fehler
        );

        alert(
            "Der Server konnte nicht erreicht werden."
        );

    }

}

            "Benutzerprüfung fehlgeschlagen:",
            fehler
        );

    }

}

benutzerPruefen();
